<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | The Mortgage Guide Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">The Mortgage Guide Hub</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="guides.html">Guides</a>
        <a href="calculator.html">Calculator</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Get in Touch</h1>
    <p>Have a question about mortgages or your home-buying options? Fill out the form below and we'll be in touch.</p>

    <form name="lead-form" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="leadForm">
      <input type="hidden" name="form-name" value="lead-form">
      <p style="display:none">
        <label>Don't fill this out if you're human: <input name="bot-field"></label>
      </p>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">

      <label for="interest">I'm Interested In</label>
      <select id="interest" name="interest">
        <option>Buying a home</option>
        <option>Refinancing</option>
        <option>General questions</option>
      </select>

      <button type="submit">Submit</button>
    </form>

    <div id="successMsg" class="success-msg">
      Thanks! Your message has been received. We'll be in touch soon.
    </div>
  </main>

  <footer>
    &copy; 2026 The Mortgage Guide Hub. All rights reserved.
  </footer>
</body>
</html>
