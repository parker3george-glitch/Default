<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortgage Calculator | The Mortgage Guide Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">The Mortgage Guide Hub</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="guides.html">Guides</a>
        <a href="calculator.html">Calculator</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Mortgage Payment Calculator</h1>
    <p>Estimate your monthly mortgage payment based on loan amount, interest rate, and term.</p>

    <form onsubmit="return false;">
      <label for="loanAmount">Loan Amount ($)</label>
      <input type="number" id="loanAmount" placeholder="e.g. 300000" min="0" step="1000">

      <label for="interestRate">Interest Rate (%)</label>
      <input type="number" id="interestRate" placeholder="e.g. 6.5" min="0" step="0.01">

      <label for="loanTerm">Loan Term (years)</label>
      <select id="loanTerm">
        <option value="15">15 years</option>
        <option value="20">20 years</option>
        <option value="30" selected>30 years</option>
      </select>

      <button type="button" id="calcBtn" class="calc-btn">Calculate Payment</button>

      <div id="calcResult" class="calc-result"></div>
    </form>
  </main>

  <footer>
    &copy; 2026 The Mortgage Guide Hub. All rights reserved.
  </footer>

  <script src="js/calculator.js"></script>
</body>
</html>
